amcl:
  ros__parameters:

    use_sim_time: true

    base_frame_id: "base_footprint"
    odom_frame_id: "odom"
    global_frame_id: "map"

    scan_topic: "scan"

    min_particles: 500
    max_particles: 2000

    laser_model_type: "likelihood_field"

    update_min_d: 0.2
    update_min_a: 0.2

    tf_broadcast: true